<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Demo Jquery y JqueryUI</title>
        <input type="archivo" href="jquery-ui.css" />
        <input type="archivo" href="jquery-3.5.0.js" />
        <input type="archivo" href="jquery-ui.js" />
    </head>
    <body>
        <h2>Ejemplo de Uso de jQuery y jQueryUI</h2>
        <div id="accordion">
            <h3>Sección 1</h3>
            <div>
                <p id="nombreCarrera">Tecnologías de la Información</p>
                <p id="nombreUniversidad">
                    Universidad Técnica Particular de Loja
                </p>
                <button type="submit">Generar Mensaje</button>
            </div>
            <h3>Sección 2</h3>
            <div>
                <p id="mensajeFinal"></p>
            </div>
            <h3>Sección 3</h3>
            <div>
                <p id="mensajeFinal2"></p>
            </div>
            <h3>Sección 4</h3>
            <div>
                <p id="mensajeFinal3"></p>
            </div>
        </div>
    </body>
    <script>
        $(document).ready(function () {
            $("#accordion").accordion({
                collapsible: true,
            });
            $("button").click(function () {
                var texto1 = $("#nombreCarrera").text();
                var texto2 = $("#nombreUniversidad").text();
                $("#mensajeFinal").text(
                    "Su carrera es: " +
                        texto1 +
                        ". Su universidad es " +
                        texto2,
                );
                $("#mensajeFinal2").text(
                    "Su carrera es: " +
                        texto1 +
                        ". Su universidad es " +
                        texto2,
                );
                $("#mensajeFinal3").text(
                    "Su carrera es: " +
                        texto1 +
                        ". Su universidad es " +
                        texto2,
                );
                console.log(texto1);
            });
        });
    </script>
</html>
